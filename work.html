<h1 class="hero-h" style="font-size:clamp(40px,6vw,72px)">Work <span class="count">(18)</span></h1>
<p class="hero-sub">Every project opens a full case page with all designs.</p>

<div class="big-cta rv"><h2>Like what you see?</h2><p>Let's build yours next.</p><a class="btn btn-p" href="mailto:ststudiosng@gmail.com">Book a call →</a></div>

<script src="data.js"></script>
<script src="app.js"></script>
<script>
let f="All";const cats=["All","Fintech","Telecom","FMCG","Crypto","Social","Creative","App","Real Estate"];
const fe=document.getElementById('filters');
function drawF(){fe.innerHTML="";cats.forEach(c=>{const n=c==="All"?PROJECTS.length:PROJECTS.filter(p=>p.c===c).length;const b=document.createElement('button');b.className='pillx';b.style.cursor='pointer';if(f===c){b.style.background='#111';b.style.color='#fff'}b.textContent=`${c} (${n})`;b.onclick=()=>{f=c;drawF();draw()};fe.appendChild(b)})}
function draw(){const g=document.getElementById('grid');g.innerHTML="";PROJECTS.filter(p=>f==="All"||p.c===f).forEach(p=>{const a=document.createElement('a');a.className='card vis';a.href="project.html?id="+p.id;a.innerHTML=`<img loading="lazy" src="${p.img}"/><div class="meta"><div class="cat">${p.full} · ${p.r}</div><h3>${p.t}</h3><p>${p.d} — ${p.g.length} designs →</p></div>`;g.appendChild(a)})}
drawF();draw();setTimeout(()=>window.__reveal(".card"),300);
</script>
